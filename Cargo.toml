[package]
name = "oxide-agent"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"

# Keep the remote agent out of the root Oxide workspace. It is built as a
# standalone release artifact and then copied into app resources.
[workspace]

[dependencies]
base64 = "0.23"
zeroize = "1"
libc = "0.2"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
